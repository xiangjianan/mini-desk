<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：内容延伸到刘海/状态栏下，由页面自己涂满该区域
         （mobile-home 顶部即 Header 的浅蓝渐变；桌面壳用 safe-area padding 防遮挡）。
         也规避 iOS standalone 采样 fixed 元素/ body 背景涂状态栏导致的灰条问题。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- black-translucent 让 standalone 状态栏透明（与 cover 配合缺一不可，参考 time-traveler）：
         页面渐变直接铺到刘海下。代价：iOS 状态栏时间/电池符号固定白色，
         浅色主题下对比度低是已知取舍（刻意保持极浅渐变，不为此加深顶部）。 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- 无前缀标准版：Chrome 只认这个并会对仅有 apple- 版打弃用警告；iOS Safari
         则只认 apple- 版，两者共存缺一不可（manifest 的 standalone 声明亦已就位）。 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="app-version" content="1.0.189" />
    <meta name="theme-color" content="#fcfcfe" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png">
    <title>Mini Desk</title>
    <style>
      /* 首屏 loading 骨架:Vue 挂载 #app 时会自动替换,无需手动清理 */
      .app-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #fcfcfe;
        color: #6e6e73;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        z-index: 9999;
      }
      html[data-theme="dark"] .app-boot {
        background: #262628;
        color: rgba(235, 235, 245, 0.66);
      }
      .app-boot-icon {
        width: 38px;
        height: 30px;
        border-radius: 8px;
        background: #ffffff;
        border: 1px solid rgba(60, 60, 67, 0.14);
        box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04), 0 12px 32px rgba(15, 23, 42, 0.07);
        position: relative;
        animation: app-boot-float 2s ease-in-out infinite;
      }
      html[data-theme="dark"] .app-boot-icon {
        background: #2c2c2e;
        border-color: rgba(84, 84, 88, 0.5);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18), 0 16px 36px rgba(0, 0, 0, 0.24);
      }
      .app-boot-icon::before {
        content: "";
        position: absolute;
        top: 6px;
        left: 50%;
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: #007aff;
        opacity: 0.7;
        transform: translateX(-50%);
        box-shadow: -7px 0 0 rgba(60, 60, 67, 0.12), 7px 0 0 rgba(60, 60, 67, 0.12);
      }
      html[data-theme="dark"] .app-boot-icon::before {
        background: #0a84ff;
        box-shadow: -7px 0 0 rgba(235, 235, 245, 0.14), 7px 0 0 rgba(235, 235, 245, 0.14);
      }
      .app-boot-icon::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 14px;
        border-bottom: 1px solid rgba(60, 60, 67, 0.14);
      }
      html[data-theme="dark"] .app-boot-icon::after {
        border-bottom-color: rgba(84, 84, 88, 0.5);
      }
      .app-boot-label {
        font-size: 12px;
        letter-spacing: 0.04em;
      }
      @keyframes app-boot-float {
        0%, 100% { opacity: 0.6; transform: translateY(0); }
        50% { opacity: 1; transform: translateY(-2px); }
      }
    </style>
    <!-- 防主题闪烁:同步外链脚本,需在首帧渲染前执行;不可内联(CSP script-src 'self' 会拦截) -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="app-boot" role="status" aria-label="加载中">
        <div class="app-boot-icon" aria-hidden="true"></div>
        <div class="app-boot-label">Mini Desk</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
