      var ARRIVALS = [0, 1.04, 1.52, 2.0, 2.48, 2.96, 3.44]; // dwell starts (station centered)

      var CALLOUT_AT = 3.62;

      var STATIONS = [

        { idx: "07", name: "家庭账本", slogan: "收支流水一目了然" },

      var $all = function (sel) { return Array.prototype.slice.call(document.querySelectorAll(sel)); };
      var world = document.querySelectorAll("#f08-world")[0];
      var cards = $all(".f08-card");
      var names = $all(".f08-name");
      var slogans = $all(".f08-slogan");
      var dots = $all(".f08-dot");
      var roIdx = document.querySelectorAll("#f08-ro-idx")[0];
      var roName = document.querySelectorAll("#f08-ro-name")[0];
      var roSlogan = document.querySelectorAll("#f08-ro-slogan")[0];

      /* Virtual camera (viewport-change, PAN mode) — single source of truth + one writer.
         No drift: the world must sit exactly still during each dwell so the DOM card
         frame stays aligned with the hoisted video's fixed host rect. */
      var cam = { x: ANCHOR - STEP * 0 };
      function applyCam() {
        world.style.transform = "translateX(" + cam.x + "px)";

      var tl = gsap.timeline({ paused: true });

      /* Scene 1 — open on station 1: title reads through the incoming zoom-through,
         station name spring-pops, video 1 cuts in once the wrapper settles. */
      tl.fromTo("#f08-title", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0.05);

      tl.fromTo("#f08-glow-a", { opacity: 0.55 }, { opacity: 1, duration: 1.8, ease: "sine.inOut" }, 0.2);
      tl.fromTo("#f08-glow-b", { opacity: 0.4 }, { opacity: 1, duration: 2.2, ease: "sine.inOut" }, 0.6);

      /* Scenes 2–7 — station march: per beat one ease-in-out whip pan, a DoF rack
         (departing card defocuses to 6px + dims, arriving card resolves to 0px sharp
         exactly when its hoisted video cuts in), and the station name spring-pops. */
      gsap.set(cards.slice(1), { "--dof": "6px", opacity: 0.55, scale: 0.94 });
      gsap.set(cards[0], { borderColor: "#5eeabe" });

        tl.fromTo(names[target], { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, ARRIVALS[target]);
