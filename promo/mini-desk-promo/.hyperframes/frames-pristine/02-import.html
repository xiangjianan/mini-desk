  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      var DUR = 5.695;
      var q = function (s) { return document.querySelector(s); };

      var tl = gsap.timeline({ paused: true });

      /* ———— Scene 1 (0.0–1.2s)：mock 自右 edge slide-in，power3 长尾定格（相机锁死） ———— */
      tl.fromTo(
        "#f02-import-mock",
        { x: 1230 },
        { x: 0, duration: 0.95, ease: "power3.out" },
        0
      );

      /* ———— 地床 aurora 低幅漂移（sine-wave-loop，t 的确定函数，seek 安全） ———— */
      var washA = q(".f02-import-wash-a");
      var washB = q(".f02-import-wash-b");
      var drift = { t: 0 };
      tl.to(
        drift,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            washA.style.transform =
              "translate(" + (Math.sin(drift.t * 0.55) * 22) + "px," + (Math.cos(drift.t * 0.42) * 14) + "px)";
            washB.style.transform =
              "translate(" + (Math.cos(drift.t * 0.48) * 26) + "px," + (Math.sin(drift.t * 0.5) * 18) + "px)";
          },
        },
        0
      );

      /* ———— Scene 2 (1.2–3.2s)：accent line → eyebrow → 标题逐字落定 ———— */
      tl.fromTo(
        "#f02-import-accentline",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.45, ease: "power3.out" },
        1.15
      );
      tl.fromTo(
        "#f02-import-eyebrow",
        { opacity: 0, y: 18 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" },
        1.25
      );

      /* dynamic-content-sequencing：每字窗口由内容长度计算，reduce 成绝对时间，不逐个手写偏移 */
      var TITLE_CHARS = ["导", "入", "即", "成", "形"];
      var TITLE_START = 1.35;
      var BASE_DURATION = 0.2;
      var SEC_PER_CHAR = 0.06;
      var words = document.querySelectorAll(".f02-import-word");
      var cumulative = 0;
      var TIMELINE = [];
      for (var ci = 0; ci < TITLE_CHARS.length; ci++) {
        var entryDur = BASE_DURATION + TITLE_CHARS[ci].length * SEC_PER_CHAR;
        TIMELINE.push({ start: TITLE_START + cumulative, end: TITLE_START + cumulative + entryDur });
        cumulative += entryDur;
      }
      TIMELINE.forEach(function (entry, i) {
        tl.fromTo(
          words[i],
          { opacity: 0, y: 34, scale: 0.92 },
          { opacity: 1, y: 0, scale: 1, duration: 0.52, ease: "power3.out" },
          entry.start
        );
      });

      tl.fromTo(
        "#f02-import-sub",
        { opacity: 0, y: 16 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" },
        2.55
      );

      /* ———— Scene 3 (3.2–4.8s)：步骤链前两节依序 pop（低过冲） ———— */
      function nodePop(id, at) {
        tl.fromTo(
          id,
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(1.2)" },
          at
        );
      }
      function arrowIn(id, at) {
        tl.fromTo(
          id,
          { opacity: 0, x: -10 },
          { opacity: 0.55, x: 0, duration: 0.3, ease: "power2.out" },
          at
        );
      }
      nodePop("#f02-import-node-1", 3.3);
      arrowIn("#f02-import-arrow-1", 3.72);
      nodePop("#f02-import-node-2", 4.05);
      arrowIn("#f02-import-arrow-2", 4.48);

      /* ———— Scene 4 (4.8–5.695s)：第三节「成形」落拍 + asr-keyword-glow ———— */
      nodePop("#f02-import-node-3", 4.85);

      var glowEl = q("#f02-import-glow-word");
      var GLOW_TIMING = { start: 4.85, end: 5.18 };
      var ATTACK_DUR = 0.12;
      var RELEASE = 0.5;
      var REST_LEVEL = 0.14;
      var MAX_BLUR = 34;
      var MAX_SCALE_BOOST = 0.1;
      function glowEnvelope(time, start, end) {
        if (time < start) return 0;
        if (time < end) return Math.min((time - start) / ATTACK_DUR, 1);
        var releaseEnd = end + RELEASE;
        if (time < releaseEnd) return 1 - ((time - end) / RELEASE) * (1 - REST_LEVEL);
        return REST_LEVEL;
      }
      var glowDriver = { t: 0 };
      tl.to(
        glowDriver,
        {
          t: DUR,
          duration: DUR,
          ease: "none",
          onUpdate: function () {
            var env = glowEnvelope(glowDriver.t, GLOW_TIMING.start, GLOW_TIMING.end);
            glowEl.style.textShadow = "0 0 " + MAX_BLUR * env + "px rgba(94, 234, 190, " + 0.85 * env + ")";
            glowEl.style.transform = "scale(" + (1 + MAX_SCALE_BOOST * env) + ")";
          },
        },
        0
      );

      window.__timelines["02-import"] = tl;
    })();
  </script>
