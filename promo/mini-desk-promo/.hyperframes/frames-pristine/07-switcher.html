  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["07-switcher"] = tl;

    const one = (id) => document.getElementById(id);
    const DUR = 7.523;

    /* ---- Scene 1 (0.0-1.6): the anchor lands once and PINS — opacity only, zero
       geometry motion ever again. The pinned board's screening source fades with it. */
    tl.fromTo("#f07-board", { opacity: 0 }, { opacity: 1, duration: 0.44, ease: "power2.out" }, 0.06);
    tl.fromTo(
      ["#f07-depth-a", "#f07-depth-b"],
      { y: 18, opacity: 0 },
      { y: 0, opacity: 1, duration: 0.55, ease: "power2.out", stagger: 0.12 },
      0.1
    );
    tl.fromTo(
      "#f07-eyebrow",
      { opacity: 0, letterSpacing: "14px" },
      { opacity: 1, letterSpacing: "6px", duration: 0.5, ease: "power2.out" },
      0.15
    );
    const vSwitcher = one("f07-v-switcher"); // hoisted to the host root at assembly
    if (vSwitcher) {
      tl.fromTo(vSwitcher, { opacity: 0 }, { opacity: 1, duration: 0.36, ease: "power1.out" }, 0.1);
    }

    /* ---- Scene 2 (1.6-3.6): discrete hard-cut cycle 工作 -> 学习 -> 旅行, one chip
       on screen per beat at its own orbit position; the board title label swaps in
       the same instants (discrete-text-sequence: state array + reverse search, jumps
       are instant, min-width on the label kills jitter). ---- */
    const STATES = [
      { t: 0.0, chip: null },
      { t: 1.7, chip: "work" },
      { t: 2.35, chip: "study" },
      { t: 3.0, chip: "travel" },
      { t: 3.75, chip: "all" }, // Scene 3 (3.6-5.0): 三 chip 并存定格 — emphasis beat
    ];
    const SPACES = {
      work: { name: "工作", dot: "#5eeabe" },
      study: { name: "学习", dot: "#22d3ee" },
      travel: { name: "旅行", dot: "#a78bfa" },
    };
    const chipEls = {
      work: one("f07-chip-work"),
      study: one("f07-chip-study"),
      travel: one("f07-chip-travel"),
    };
    const nameEls = Array.from(document.querySelectorAll("#root .f07-space-name"));
    const dotEls = Array.from(document.querySelectorAll("#root .f07-space-dot"));
    let lastLabel = "";

    const cyc = { t: 0 };
    tl.to(
      cyc,
      {
        t: DUR,
        duration: DUR,
        ease: "none",
        onUpdate: () => {
          let s = STATES[0];
          for (let i = STATES.length - 1; i >= 0; i--) {
            if (cyc.t >= STATES[i].t) { s = STATES[i]; break; }
          }
          const cur = s.chip;
          for (const k in chipEls) {
            chipEls[k].style.opacity = cur === k || cur === "all" ? "1" : "0";
          }
          if (cur && cur !== "all" && cur !== lastLabel) {
            lastLabel = cur;
            nameEls.forEach((el) => { el.textContent = SPACES[cur].name; });
            dotEls.forEach((el) => { el.style.backgroundColor = SPACES[cur].dot; });
          }
        },
      },
      0
    );

    /* Scene 3 emphasis: primary 描边收束 + a restrained completion pulse. */
    const three = ["#f07-chip-work", "#f07-chip-study", "#f07-chip-travel"];
    tl.to(
      three,
      {
        borderColor: "rgba(94,234,190,0.55)",
        color: "#5eeabe",
        backgroundColor: "rgba(94,234,190,0.07)",
        duration: 0.18,
        ease: "power2.out",
      },
      3.75
    );
    tl.to(three, { scale: 1.05, duration: 0.1, ease: "power1.out" }, 3.75);
    tl.to(three, { scale: 1, duration: 0.1, ease: "power1.in" }, 3.85);

    /* ---- Scene 4 (5.0-end): 深色浅色随手切换 — the board reskins IN PLACE. ---- */
    tl.fromTo("#f07-row", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 4.75);

    /* flip 1: 深 -> 浅 (theme-crossfade-morph: complete pre-styled skins, simultaneous
       opposing opacity tweens, shared pixel-identical geometry, nothing else tweens) */
    tl.to("#f07-skin-dark", { opacity: 0, duration: 0.4, ease: "power2.inOut" }, 5.08);
    tl.fromTo("#f07-skin-light", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.inOut" }, 5.08);
    tl.to("#f07-bloom", { opacity: 0.5, duration: 0.4, ease: "power2.inOut" }, 5.08);
    tl.to(
      "#f07-chip-light",
      { borderColor: "rgba(94,234,190,0.55)", color: "#5eeabe", backgroundColor: "rgba(94,234,190,0.07)", duration: 0.18, ease: "power2.out" },
      5.24
    );
    tl.to(
      "#f07-chip-dark",
      { borderColor: "rgba(255,255,255,0.12)", color: "#a6b1c6", backgroundColor: "rgba(255,255,255,0.03)", duration: 0.18, ease: "power2.out" },
      5.24
    );

    /* lockup completion: the final element quietly joins the still-unmoved anchor */
    tl.fromTo(
      "#f07-chip-life",
      { opacity: 0, scale: 0.86 },
      { opacity: 1, scale: 1, duration: 0.34, ease: "back.out(1.6)" },
      5.65
    );

    /* flip 2: 浅 -> 深, resolved before the frame edge; long settled hold to the end */
    tl.to("#f07-skin-light", { opacity: 0, duration: 0.29, ease: "power2.inOut" }, 7.18);
    tl.to("#f07-skin-dark", { opacity: 1, duration: 0.29, ease: "power2.inOut" }, 7.18);
    tl.to("#f07-bloom", { opacity: 0, duration: 0.29, ease: "power2.inOut" }, 7.18);
    tl.to(
      "#f07-chip-dark",
      { borderColor: "rgba(94,234,190,0.55)", color: "#5eeabe", backgroundColor: "rgba(94,234,190,0.07)", duration: 0.15, ease: "power2.out" },
      7.3
    );
    tl.to(
      "#f07-chip-light",
      { borderColor: "rgba(255,255,255,0.12)", color: "#a6b1c6", backgroundColor: "rgba(255,255,255,0.03)", duration: 0.15, ease: "power2.out" },
      7.3
    );

    /* bounded aurora drift beneath the cycle — the anchor itself gets none */
    const drift = { p: 0 };
    tl.to(
      drift,
      {
        p: Math.PI * 2,
        duration: DUR,
        ease: "none",
        onUpdate: () => {
          gsap.set("#f07-aur-a", { x: Math.sin(drift.p) * 24, y: Math.cos(drift.p * 0.9) * 14 });
          gsap.set("#f07-aur-b", { x: Math.cos(drift.p) * -20, y: Math.sin(drift.p * 0.8) * -12 });
        },
      },
      0
    );
  </script>
