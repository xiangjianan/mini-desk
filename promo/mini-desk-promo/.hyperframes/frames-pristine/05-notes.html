    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var DUR = 5.773;
        window.__timelines = window.__timelines || {};
        var tl = gsap.timeline({ paused: true });
        window.__timelines["05-notes"] = tl;

        var drift = document.querySelector(".n5-drift");
        var pills = document.querySelectorAll(".n5-pill");
        var labels = document.querySelectorAll(".n5-pill-label");

        /* ── Scene 1 (0.0–1.0) — surface establishes: mock slides in from the
              left and settles; the recording boots on its screen at 0.52
              (host-hoisted video, clip-gated); eyebrow lands with it. ── */
        tl.fromTo(
          ".n5-mock",
          { x: -120, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.55, ease: "power3.out" },
          0.02
        );
        tl.fromTo(
          ".n5-eyebrow",
          { y: 16, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" },
          0.5
        );

        /* ── Scene 2 (1.0–2.2) — 「点进去 就写」per-word reveal on the VO;
              tab rail fades in but stays grey. ── */
        tl.fromTo(
          ".n5-l1",
          { y: 34, opacity: 0, filter: "blur(10px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" },
          1.05
        );
        tl.fromTo(
          ".n5-l2",
          { y: 34, opacity: 0, filter: "blur(10px)" },
          { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.5, ease: "expo.out" },
          1.45
        );
        tl.fromTo(
          ".n5-pill",
          { y: 14, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.35, ease: "power2.out", stagger: 0.07 },
          1.72
        );
        tl.fromTo(
          ".n5-sub",
          { y: 14, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" },
          2.0
        );

        /* ── Scenes 3–4 — one linear driver (ease none) sweeping scene time:
              · discrete state step — a pill flips to its primary outline the
                beat its tab is named (A 2.42 / B 3.06 / C 3.70, litness persists);
              · asr-keyword-glow — attack/sustain/release envelope drives the
                glyph text-shadow + scale, decaying to a rest breadcrumb, with a
                slow sine breathe after release;
              · sine idle float on the mock window (static-tour camera floor). ── */
        var TAB_STARTS = [2.42, 3.06, 3.7];
        var ATTACK = 0.12,
          SUSTAIN = 0.3,
          RELEASE = 0.45,
          REST = 0.16,
          MAX_BLUR = 30,
          MAX_BOOST = 0.07;

        function envAt(t, s) {
          if (t < s) return 0;
          if (t < s + ATTACK) return (t - s) / ATTACK;
          if (t < s + ATTACK + SUSTAIN) return 1;
          var rel = (t - s - ATTACK - SUSTAIN) / RELEASE;
          return rel >= 1 ? REST : 1 - rel * (1 - REST);
        }
        function lerp(a, b, k) {
          return Math.round(a + (b - a) * k);
        }

        var tabs = [];
        for (var i = 0; i < TAB_STARTS.length; i++) {
          tabs.push({ pill: pills[i], label: labels[i], start: TAB_STARTS[i] });
        }

        var drive = { t: 0 };
        tl.to(
          drive,
          {
            t: DUR,
            duration: DUR,
            ease: "none", /* linear — t maps 1:1 to scene time */
            onUpdate: function () {
              var t = drive.t;
              drift.style.transform =
                "translate(" +
                (Math.sin(t * 0.9) * 4).toFixed(2) +
                "px," +
                (Math.sin(t * 0.6 + 1.3) * 5).toFixed(2) +
                "px)";
              for (var j = 0; j < tabs.length; j++) {
                var tb = tabs[j];
                var e0 = envAt(t, tb.start);
                var lit = t >= tb.start;
                var breathe =
                  t > tb.start + ATTACK + SUSTAIN ? 1 + Math.sin(t * 4.5) * 0.1 : 1;
                var e = e0 * breathe;
                tb.pill.style.borderColor = lit
                  ? "rgba(94,234,190,0.5)"
                  : "rgba(255,255,255,0.12)";
                tb.pill.style.backgroundColor = lit
                  ? "rgba(94,234,190,0.07)"
                  : "rgba(255,255,255,0.03)";
                var k = Math.max(e, lit ? 1 : 0);
                tb.label.style.color =
                  "rgb(" +
                  lerp(120, 94, k) +
                  "," +
                  lerp(128, 234, k) +
                  "," +
                  lerp(148, 190, k) +
                  ")";
                tb.label.style.textShadow =
                  "0 0 " +
                  (MAX_BLUR * e).toFixed(1) +
                  "px rgba(94,234,190," +
                  (0.5 * e).toFixed(3) +
                  ")";
                tb.label.style.transform = "scale(" + (1 + MAX_BOOST * e).toFixed(4) + ")";
              }
            },
          },
          0
        );
      })();
